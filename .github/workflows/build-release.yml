name: Build & Deploy PDV

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [created]

jobs:
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black
    
    - name: 🔍 Lint with flake8
      run: |
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: 🎨 Format check with Black
      run: black --check src tests 2>&1 || echo "Files need formatting"
    
    - name: ✅ Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term || echo "No tests yet"
    
    - name: 📊 Upload coverage
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyInstaller
    
    - name: 🏗️ Build executable
      run: |
        pyinstaller --name=PDV \
          --windowed \
          --onefile \
          --icon=assets/icon.ico \
          --add-data="src:src" \
          src/main.py
      continue-on-error: true
    
    - name: 📤 Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: PDV-executable
        path: dist/
      continue-on-error: true

  release-assets:
    name: 📦 Create Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: 📥 Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: PDV-executable
        path: dist/
      continue-on-error: true
    
    - name: 📝 Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        body: |
          # PDV Release
          
          Sistema de Ponto de Venda (PDV)
          
          ## Instalação
          - Windows: Execute `PDV.exe`
          - Linux/Mac: Execute `./PDV`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  code-quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: 📊 SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
